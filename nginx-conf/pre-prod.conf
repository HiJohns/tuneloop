# ==========================================
# Pre-Production Environment
# ==========================================

server {
    listen 80;
    server_name preiam.cadenzayueqi.com preweb.cadenzayueqi.com prewx.cadenzayueqi.com;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:5562;
         return 301 https://$host$request_uri; }
}

# Pre-Prod IAM (:5562)
server {
    listen 443 ssl;
    server_name preiam.cadenzayueqi.com;

    ssl_certificate /etc/nginx/certs/live/web.cadenzayueqi.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/web.cadenzayueqi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:5562;
        
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Pre-Prod Web (:5563)
server {
    listen 443 ssl;
    server_name preweb.cadenzayueqi.com;

    ssl_certificate /etc/nginx/certs/live/web.cadenzayueqi.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/web.cadenzayueqi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/tuneloop-pre/www;
    index index.html;

    location / { try_files $uri $uri/ @fallback; }
    location @fallback { rewrite ^ /index.html break; }

    location /assets/ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5563;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        root /opt/tuneloop-pre;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        location ~* \.(php|pl|py|sh|cgi)$ { deny all; }
    }
}

# Pre-Prod Mobile/WX (:5564)
server {
    listen 443 ssl;
    server_name prewx.cadenzayueqi.com;

    ssl_certificate /etc/nginx/certs/live/web.cadenzayueqi.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/web.cadenzayueqi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/tuneloop-pre/mobile;
    index index.html;

    location / { try_files $uri $uri/ @fallback; }
    location @fallback { rewrite ^ /index.html break; }

    location /assets/ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5564;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /uploads/ {
        root /opt/tuneloop-pre;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        location ~* \.(php|pl|py|sh|cgi)$ { deny all; }
    }
}
