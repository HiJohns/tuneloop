# ==========================================
# 1. 全局 80 端口强转 HTTPS 443
# ==========================================
server {
    listen 80;
    client_max_body_size 100m;
    server_name web.cadenzayueqi.com wx.cadenzayueqi.com iam.cadenzayueqi.com;
    
    # 留着这个目录，方便以后自动续签
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 所有人访问 http 都会被 301 强转到 https
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# 2. 主业务 Web 端口 (:5558)
# ==========================================
server {
    listen 443 ssl;
    client_max_body_size 100m;
    server_name web.cadenzayueqi.com;

    ssl_certificate /etc/nginx/certs/live/web.cadenzayueqi.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/web.cadenzayueqi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/tuneloop/www;
    index index.html;

    location / {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        rewrite ^ /index.html break;
    }

    location /assets/ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5558;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        root /opt/tuneloop;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;

        location ~* \.(php|pl|py|sh|cgi)$ {
            deny all;
        }
    }
}

# ==========================================
# 3. 微信/小程序后端端口 (:5559)
# ==========================================
server {
    listen 443 ssl;
    server_name wx.cadenzayueqi.com;

    ssl_certificate /etc/nginx/certs/live/web.cadenzayueqi.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/web.cadenzayueqi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/tuneloop/mobile;
    index index.html;

    location / {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        rewrite ^ /index.html break;
    }

    location /assets/ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5559;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /uploads/ {
        root /opt/tuneloop;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;

        location ~* \.(php|pl|py|sh|cgi)$ {
            deny all;
        }
    }
}

