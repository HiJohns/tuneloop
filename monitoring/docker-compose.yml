# #2131 监控栈（预生产机本机部署）
# - gatus: 拨测/证书/邮件告警（config-as-code，配置在 gatus/config.yaml）
# - beszel-hub/-agent: 主机与容器资源监控 + 阈值告警
# UI 仅绑 127.0.0.1（访问：ssh -L 8080:127.0.0.1:8080 / -L 8090:127.0.0.1:8090 cadenza）
services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./gatus:/config
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ALERT_TO=${ALERT_TO}
    networks:
      - default
      - tuneloop_default
  beszel-hub:
    image: henrygd/beszel
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    environment:
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      HUB_URL: http://127.0.0.1:8090
      # #2129 形态：本机即被监控机

networks:
  # 接入 tuneloop 项目网络，使 gatus 可按容器名探测 postgres（#2131）
  tuneloop_default:
    external: true
