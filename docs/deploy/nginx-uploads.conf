# Nginx upload security hardening for media files
# Include this in your nginx server block, for example:
#   server {
#       listen 80;
#       server_name your-domain.com;
#       include /path/to/docs/nginx-uploads.conf;
#   }

# #1914 P5（切换读）：本地未命中 → 302 重定向到 OSS，兼容历史/富文本内嵌的相对 URL，
# 无需改库。实施步骤：
#   1) 将下方 <OSS_MEDIA_DOMAIN> 替换为 bucket 直连域（如 tuneloop-media.oss-cn-beijing.aliyuncs.com）
#      或自定义 CDN 域（img.cadenzayueqi.com，见 #1990 CNAME）；
#   2) 预生产先改 nginx 并 reload 验证，再推生产；
#   3) 回退：移除 @oss_media_fallback 引用（或改回 try_files $uri =404）。
# 说明：face_captures/ 为私有前缀，OSS 模式下由后端下发**签名 URL**（不再走相对路径）；
# 本地模式仍由下方 try_files 直接命中本地文件。
location @oss_media_fallback {
    rewrite ^/uploads/media/(.*)$ https://<OSS_MEDIA_DOMAIN>/$1 permanent;
}

# Serve media uploads from the /uploads/media/ directory
location /uploads/media/ {
    # Only allow image and video file extensions
    location ~* \.(jpg|jpeg|png|gif|webp|bmp|svg|ico|mp4|webm|mov|avi|mkv)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @oss_media_fallback;
    }

    # Deny all other file types (php, sh, exe, html, etc.)
    location ~* \. {
        deny all;
        return 403;
    }

    # Deny requests with no file extension
    location ~ /\. {
        deny all;
        return 403;
    }
}

# Also apply to the legacy /uploads/photos/ directory
location /uploads/photos/ {
    location ~* \.(jpg|jpeg|png|gif|webp|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \. {
        deny all;
        return 403;
    }
}
